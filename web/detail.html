<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Complaint Details</title>
  <link rel="stylesheet" href="/static/style.css?v=2">
</head>
<body>
<header>
  <h1>Complaint <span id="title"></span></h1>
  <p><a href="javascript:history.back()">← Back to results</a></p>
</header>
<main id="content"></main>

<script>
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
}

// 本文の中の「根拠の文」に色を付ける（なぜこの分類になったかが分かるように）
function highlight(summary, evidence) {
  const text = escapeHtml(summary);
  const ev = escapeHtml(evidence);
  if (!ev) return text;
  const i = text.toLowerCase().indexOf(ev.toLowerCase());
  if (i < 0) return text;
  return text.slice(0, i) + "<mark>" + text.slice(i, i + ev.length) + "</mark>" + text.slice(i + ev.length);
}

function row(label, value) {
  return `<dt>${label}</dt><dd>${value === "" || value == null ? "—" : value}</dd>`;
}

async function load() {
  const odi = new URLSearchParams(location.search).get("odi");
  const res = await fetch(`/api/complaints/${encodeURIComponent(odi)}`);
  const main = document.getElementById("content");
  if (!res.ok) {
    main.innerHTML = `<section class="card">Complaint ${escapeHtml(odi)} was not found</section>`;
    return;
  }
  const c = await res.json();
  document.getElementById("title").textContent = c.odi_number;
  const yes = v => v ? "Yes" : "No";

  main.innerHTML = `
    <section class="card">
      <h2>Classification (v7)</h2>
      <dl class="detail-grid">
        ${row("Safety impact", `<span class="safety safety-${c.safety_impact}">${c.safety_impact}</span>`)}
        ${row("Affected functions", c.functions.map(f =>
            `<span class="tag ${f.is_root ? "main" : ""}">${escapeHtml(f.name)}${f.is_root ? " (root)" : ""}</span>`).join("")
            + (c.root_function_group === "Unknown" ? `<span class="tag main">root: Unknown</span>` : ""))}
        ${row("Symptom", escapeHtml(c.symptom) + (c.other_detail ? ` (${escapeHtml(c.other_detail)})` : ""))}
        ${row("When it happened", escapeHtml(c.trigger))}
        ${row("Environment", escapeHtml(c.environment))}
        ${row("Stated cause", c.stated_cause ? `${escapeHtml(c.stated_cause)} (according to: ${escapeHtml(c.cause_source)})` : "")}
        ${row("Evidence", `<mark>${escapeHtml(c.evidence)}</mark>`)}
        ${row("AI confidence", escapeHtml(c.confidence))}
      </dl>
    </section>

    <section class="card">
      <h2>Complaint text (highlighted part is the evidence)</h2>
      <div class="summary">${highlight(c.summary, c.evidence)}</div>
    </section>

    <section class="card">
      <h2>NHTSA record</h2>
      <dl class="detail-grid">
        ${row("Model year", c.model_year)}
        ${row("Powertrain", escapeHtml(c.powertrain) + (c.trim ? ` (${escapeHtml(c.trim)})` : ""))}
        ${row("Incident date", escapeHtml(c.date_of_incident))}
        ${row("Date filed", escapeHtml(c.date_filed))}
        ${row("Crash / Fire", `${yes(c.crash)} / ${yes(c.fire)}`)}
        ${row("Injuries / Deaths", `${c.injuries} / ${c.deaths}`)}
        ${row("Components selected by owner", c.components.map(x => `<span class="tag">${escapeHtml(x)}</span>`).join(""))}
        ${row("Duplicate", c.duplicate_of ? `Same incident as <a href="/detail?odi=${c.duplicate_of}">${c.duplicate_of}</a>` : "")}
      </dl>
    </section>`;
}

load();
</script>
</body>
</html>
